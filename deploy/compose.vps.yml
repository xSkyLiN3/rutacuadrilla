name: rutacuadrilla

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: rutacuadrilla
      POSTGRES_USER: rutacuadrilla
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    expose:
      - "5432"
    shm_size: 128mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s

  api:
    image: rutacuadrilla-api:${APP_RELEASE:?Define APP_RELEASE in deploy/.env}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      APP_PROFILE: simple
      API_HOST: 0.0.0.0
      API_PORT: "4310"
      CORS_ORIGIN: https://${APP_HOST:?Define APP_HOST}
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      TRUST_PROXY: "1"
    secrets:
      - database_url
      - session_secret
    networks:
      - backend
    expose:
      - "4310"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4310/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  edge:
    image: rutacuadrilla-edge:${APP_RELEASE:?Define APP_RELEASE in deploy/.env}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
        restart: true
    environment:
      APP_HOST: ${APP_HOST:?Define APP_HOST}
    ports:
      - "127.0.0.1:${EDGE_HTTP_PORT:-8432}:80"
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=8m,mode=0700
      - /data:size=8m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres_data: {}

secrets:
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  session_secret:
    file: ./secrets/session_secret
