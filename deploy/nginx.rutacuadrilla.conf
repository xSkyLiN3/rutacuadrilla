# Plantilla HTTP para un host con Nginx existente.
#
# 1. Instalar como /etc/nginx/sites-available/rutacuadrilla.conf y habilitarlo.
# 2. Validar y recargar Nginx.
# 3. Ejecutar Certbot con --nginx --redirect para añadir TLS y redirección HTTPS.
#
# Caddy permanece privado en 127.0.0.1:8432; no termina TLS ni escucha fuera
# del loopback del host.
server {
    listen 80;
    server_name app.example.com;
    server_tokens off;

    # Certbot puede validar por webroot antes de modificar este virtual host.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8432;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
